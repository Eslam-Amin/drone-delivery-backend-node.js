version: "3.8"

services:
  # Database Service
  postgres:
    image: postgres:15-alpine
    container_name: drone_delivery_postgres
    restart: always
    environment:
      POSTGRES_USER: penny_user
      POSTGRES_PASSWORD: penny_password
      POSTGRES_DB: drone_delivery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penny_user -d drone_delivery"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Your Node.js App
  api:
    build: .
    container_name: drone_api
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: super_secret_key_change_me
      DATABASE_URL: postgresql://penny_user:penny_password@drone_delivery_postgres:5432/drone_delivery?schema=public
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # pgAdmin Service (UI)
  pgadmin:
    image: dpage/pgadmin4
    container_name: penny_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@penny.co
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
