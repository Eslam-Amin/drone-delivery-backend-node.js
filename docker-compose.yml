version: "3.8"

services:
  # 1. The Database Service
  postgres:
    image: postgres:15-alpine
    container_name: drone_delivery_postgres
    restart: always
    environment:
      POSTGRES_USER: penny_user
      POSTGRES_PASSWORD: penny_password
      POSTGRES_DB: drone_delivery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penny_user -d drone_delivery"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
